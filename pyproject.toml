# Tool configuration only. This is a skill, not a package -- there is nothing to install,
# and `run.sh` supplies the two runtime dependencies per-run through uv.

[project]
name = "i18n-skill"
version = "0"
description = "Keep translated docs in sync with the originals"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The tests import from i18n/scripts/, which is not a package and not on sys.path. The
# bootstrap has to run before those imports, so they cannot sit at the top of the file.
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
# unittest discovery works without this; it is here so `pytest` works too.
pythonpath = ["i18n/scripts"]
testpaths = ["tests"]
